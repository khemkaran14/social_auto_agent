  text: |
    Interview question we're seeing more often:

    "What should a CLAUDE.md file contain for a multi-service monorepo, and how is it different from a README?"

    A strong answer covers:
    → A README is for humans arriving at the project. CLAUDE.md is standing instructions for an AI agent working inside it.
    → It holds how to build, test and lint each service, the conventions to follow, and what not to touch.
    → In a monorepo, a short root file plus per-service files keeps each one focused.

    Practise more AI-tool interview questions (Claude, Copilot, Cursor, Gemini). Easy questions are free:
    https://aiinterviewstack.com

