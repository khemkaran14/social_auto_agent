  text: |
    Three doors. A car behind one. You pick a door, the host opens another to show a goat, and asks: switch?

    Switch. You win 2 times out of 3.

    Your first pick is right only 1 time in 3. The host always shows a goat, so the remaining 2 out of 3 moves to the other door.

    Still don't believe it? Neither did a lot of mathematicians. In Chance you can play it 1,000 times and watch the win rate settle at 66.7%.

    App launching soon. Follow for the release.

    #MontyHall #Probability #MathPuzzle #Statistics #Divyrs
