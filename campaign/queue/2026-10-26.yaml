    Quick puzzle. Answer in 10 seconds:

    A bat and a ball cost ₹110 together. The bat costs ₹100 more than the ball. How much is the ball?

    Most people say ₹10. It's ₹5. (Bat ₹105 + ball ₹5 = ₹110.)

    The fast answer feels right and isn't. Training yourself to pause and check is a skill, and it improves with practice.

    Try the free Brain Skills Challenge: https://cognibrainpro.com

