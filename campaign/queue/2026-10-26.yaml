  text: |
    Binary search finds one item in a sorted list of 1,000,000 in at most 20 steps.

    Each step looks at the middle and throws away half the list. 1,000,000 → 500,000 → 250,000 → … → 1. That's 20 halvings.

    It's the first idea that makes "O(log n)" click, and you can watch it animate step by step, forwards and backwards, in our free DSA lessons.

    201 visual lessons: DSA, system design, databases, cloud.
    Link in bio → learndatastructureandalgorithms.divyrs.com

