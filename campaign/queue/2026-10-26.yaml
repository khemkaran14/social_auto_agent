  text: |
    Mental math trick: multiplying a two-digit number by 11.

    Add the two digits and put the sum in the middle.
    36 × 11 → 3 (3+6) 6 → 396
    52 × 11 → 5 (5+2) 2 → 572

    If the sum is 10 or more, carry the 1: 87 × 11 → 8 (15) 7 → 957.

    Tricks like this are part of CogniSprint's 15-minute daily routine:
    https://cognibrainpro.com

